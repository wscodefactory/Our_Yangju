      `<a class="tile" href="${CITY}" target="_blank" rel="noopener"><span class="tag">www ↗</span><span class="lab">${L(UI.evAll)}</span></a></div>`+SRCX(['양주시청','City Hall'],['한국관광공사 TourAPI','KTO TourAPI']);

    </div>`+SRCX(['양주시청','City Hall'],['네이버 지도','Naver Map']);

  if(s.k==='local'){
    h=crumb(L(UI.secLoc))+`<h1>${L(UI.locTitle)}</h1><div class="grid">
      <button class="tile home" data-a="sec" data-v="places">${IC.about}<span class="lab">${L(UI.places)}</span></button>
      <button class="tile home" data-a="sec" data-v="eats">${IC.local}<span class="lab">${L(UI.eats)}</span></button>

      <button class="tile home" data-a="sec" data-v="events">${IC.events}<span class="lab">${L(UI.toFest)}</span></button></div>`;

view.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,s=nav.at(-1);
  if(window.ACT&&ACT[a]&&a!=='back')return ACT[a](t,s);
  if(a==='back')return back();
  if(a==='group')return go({k:'group',g:t.dataset.g});
  if(a==='stage')return go({k:'stage',s:t.dataset.s});
  if(a==='item')return go({k:'item',s:t.dataset.s,i:+t.dataset.i});
  if(a==='soon')return go({k:'soon',l:t.dataset.l});
  if(a==='quiz')return go({k:'quiz',s:s.s,i:s.i,step:0,ans:[]});
  if(a==='ans'){s.ans.push(t.dataset.v);s.step++;if(t.dataset.v==='n')s.step=99;return render()}
  if(a==='docs')return go({k:'docs',s:s.s,i:s.i});
  if(a==='apply')return go({k:'apply',s:s.s,i:s.i});
  if(a==='star'){const k=key(s.s,s.i);if(mine[k])delete mine[k];else mine[k]=1;saveMine();return render()}
  if(a==='sec')return go({k:t.dataset.v});
  if(a==='aboutItem')return go({k:'aboutItem',i:+t.dataset.i});
  if(a==='event')return go({k:'event',e:t.dataset.e});
  if(a==='certItem')return go({k:'certItem',i:+t.dataset.i});
  if(a==='noop')return;
  if(a==='askAbout'){const b=stageById(s.s).items[s.i];openGuide();draftInquiry(b);}
});
document.getElementById('home').onclick=()=>{nav=[{k:'home'}];render()};
document.getElementById('mineBtn').onclick=()=>go({k:'mine'});
document.getElementById('bigBtn').onclick=e=>{const on=document.documentElement.classList.toggle('big');e.currentTarget.setAttribute('aria-pressed',on)};
document.getElementById('langBtn').onclick=()=>{if(window.ACT&&ACT.golang)return ACT.golang();LANG=LANG==='en'?'ko':'en';try{localStorage.setItem('hy-lang',LANG)}catch(e){}
  nav=nav.map(x=>x.k==='soon'?{k:'home'}:x);chat.innerHTML='';sugs.innerHTML='';chrome();render()};

/* 양주무관 / Yangju Guide — 시안: 키워드 규칙으로 AI 동작을 흉내냄 (prototype: keyword rules stand in for AI) */
const sheet=document.getElementById('sheet'),chat=document.getElementById('chat'),sugs=document.getElementById('sugs');
function say(t,me){const d=document.createElement('div');d.className='bubble'+(me?' me':'');d.innerHTML=t;chat.appendChild(d);chat.parentElement.scrollTop=1e6;return d}
const SUG=[['월세 살고 취업 준비 중이에요','I rent a room and I am looking for a job'],['내년에 결혼하고 옥정으로 이사가요','I am getting married and moving to Okjeong'],['아기가 곧 태어나요','My baby is due soon']];
function openGuide(){sheet.hidden=false;if(!chat.children.length){say(L(['안녕하세요, 양주무관이에요. 지금 상황을 한 문장으로 말해 주세요.','Hi, I am the Yangju Guide. Tell me your situation in one sentence.']));
  sugs.innerHTML=SUG.map(x=>`<button type="button">${L(x)}</button>`).join('')}
  setTimeout(()=>document.getElementById('askIn').focus(),50)}
document.getElementById('guideBtn').onclick=openGuide;window.openGuide=openGuide;window.say=say;
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});
sugs.addEventListener('click',e=>{const b=e.target.closest('button');if(b){document.getElementById('askIn').value=b.textContent;ask()}});
document.getElementById('askForm').addEventListener('submit',e=>{e.preventDefault();ask()});
const RULES=[
 [/월세|원룸|자취|독립|rent|room|alone|live by myself/i,'indep',['월세 · 혼자 거주','Renting · living alone']],
 [/취업 ?준비|구직|일자리|백수|취준|looking for (a )?job|job ?seek|unemploy|no job/i,'job',['미취업','Job seeking']],
 [/회사|직장|취업했|재직|i work|employed|my company|office job/i,'work',['재직 중','Employed']],
 [/결혼|신혼|예비부부|marr|wedding|newlywed|engaged/i,'marry',['결혼 예정','Getting married']],
 [/임신|출산|태어|아기|출생|pregnan|baby|birth|due/i,'birth',['임신·출산','Pregnancy & birth']],
 [/육아|어린이집|아이|자녀|daycare|child|kid/i,'care',['자녀 양육','Raising a child']]];
function ask(){const inp=document.getElementById('askIn'),q=inp.value.trim();if(!q)return;inp.value='';sugs.innerHTML='';say(esc(q),true);
  const hit=RULES.filter(r=>r[0].test(q));
  if(!hit.length){say(L(['조금만 더 알려 주세요. 나이대나 지금 상황(취업, 이사, 결혼, 출산 등)을 말해 주시면 찾아드려요.','Tell me a little more, like your age or situation (job, moving, marriage, baby).']));return}
  const chips=hit.map(r=>`<span class="tag">${L(r[2])}</span>`).join(' ');
  const first=hit[0][1],lab=L(stageById(first).label);
  const d=say(LANG==='en'?`Here is what I understood: ${chips}<br>Start with the <b>${lab}</b> stage.`:`이렇게 이해했어요 ${chips}<br>가장 먼저 볼 단계는 <b>${lab}</b>이에요.`);
  const btn=document.createElement('button');btn.className='go';btn.textContent=LANG==='en'?`See ${lab} benefits →`:`${lab} 혜택 보기 →`;
  btn.onclick=()=>{sheet.hidden=true;nav=[{k:'home'},{k:'welfare'},{k:'group',g:'youth'},{k:'stage',s:first}];render()};d.appendChild(btn);
  if(/옥정|이사|전입|mov(e|ing)|okjeong/i.test(q))say(L(['양주로 이사 오시면 일부 양주시 혜택은 <b>전입일부터</b> 거주 기간을 계산해요. 이사 전에 확인해 두세요.','Some Yangju City benefits count your residence <b>from your move-in date</b>. Check before you move.']));
  if(LANG==='en')say(UI.fr[1]);
}
function draftInquiry(b){
  /* 외국인이 영어로 써도 담당자에게는 한국어 문의문을 만들어 줌 */
  const ko=`제목: ${b.name[0]} 신청 자격 문의\n\n안녕하세요. 양주시에 살고 있는 ${LANG==='en'?'외국인 주민':'청년'}입니다.\n${b.who[0]} 조건과 관련해 제 상황에서 신청할 수 있는지 확인 부탁드립니다.\n\n확인한 내용: ${b.quiz.map(q=>q[0]).join(' / ')}`;
  const intro=LANG==='en'?`I wrote your question about <b>${esc(b.name[1])}</b> <b>in Korean</b> for the office. Edit it if you need to.`:`<b>${esc(b.name[0])}</b> 담당자에게 보낼 문의를 정리했어요. 고쳐서 쓰세요.`;
  say(`${intro}<div class="draft" lang="ko">${esc(ko)}</div>`);
  const d=chat.lastChild,c=document.createElement('button');c.className='go';c.textContent=L(['문의 내용 복사','Copy the question']);
  c.onclick=async()=>{const txt=d.querySelector('.draft').textContent;try{await navigator.clipboard.writeText(txt);c.textContent=L(['복사했어요','Copied'])}catch(e){const r=document.createRange();r.selectNodeContents(d.querySelector('.draft'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);c.textContent=L(['선택했어요. 길게 눌러 복사하세요','Selected. Press and hold to copy'])}};
  d.appendChild(c);
}
saveMine();chrome();render();
</script>
<style>
.greet{display:flex;align-items:center;gap:10px;color:var(--muted);margin:8px 0 10px;font-size:.95em}
.greet .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:.95em}
.doors{display:flex;flex-direction:column;gap:14px}
.door{display:flex;align-items:center;gap:16px;width:100%;min-height:124px;border:1.5px solid var(--line);border-radius:24px;background:var(--surface);color:var(--ink);padding:20px 18px;font:inherit;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s}
.door:first-child{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.door:first-child svg{stroke:var(--bg)}.door:first-child .k{opacity:.8}
.door:hover{border-color:var(--accent)}.door:active{transform:scale(.985)}
.door svg{width:44px;height:44px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.door>span:nth-child(2){flex:1;min-width:0}
.door .lab{font-family:var(--display);font-size:1.4em;line-height:1.15;display:block;word-break:keep-all}
.door .k{font-size:.82em;color:var(--muted);display:block;margin-top:6px;line-height:1.4;word-break:keep-all}
.door:first-child .k{color:inherit}
.door .arr{font-size:1.3em;opacity:.6}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.more{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.more button{border:0;background:none;color:var(--muted);font:600 .9em var(--body);padding:8px 10px;cursor:pointer;border-radius:999px}
.more button:hover{background:var(--surface);color:var(--ink)}
.more button+button::before{content:'·';margin-right:12px;opacity:.5}
.adminlink{margin-top:28px}
.capbtn{display:flex;align-items:center;gap:16px;width:100%;border:0;border-radius:22px;background:var(--ink);color:var(--bg);padding:20px;font:inherit;cursor:pointer;text-align:left;margin-bottom:12px}
.capbtn svg{width:44px;height:44px;flex:none;stroke:var(--bg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.capbtn .lab{font-family:var(--display);font-size:1.6em;line-height:1.15;display:block}
.capbtn .k{font-size:.8em;opacity:.8;display:block;margin-top:4px}
.capbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero.small{padding:14px 18px;margin:12px 0 0;background:var(--accent-soft);color:var(--ink)}
.hero.small .lab{font-size:1.15em}
.adminlink{display:block;margin:20px auto 0;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:8px 14px;font:500 .8em var(--body);cursor:pointer}
.langrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.langrow button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .9em var(--body);cursor:pointer}
.langrow button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.canvaswrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);touch-action:none}
.canvaswrap canvas{display:block;width:100%;height:auto;cursor:crosshair}
.hint{color:var(--muted);font-size:.85em;margin:8px 0 12px;line-height:1.5}
.thinking{display:flex;align-items:center;gap:12px;padding:24px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.thinking i{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.acard{background:var(--surface);border:1.5px solid var(--accent);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.acard .k{color:var(--muted);font-size:.85em;margin:0}
.acard h1{margin:0}
.acard .big{font-family:var(--display);font-size:1.5em}
.todo{border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.todo b{font-family:var(--display);font-weight:400;font-size:1.15em}
.todo ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8em;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--check-soft);color:var(--check)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9em}
.field input,.field select,textarea.box{border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--ink);min-width:0}
textarea.box{width:100%;min-height:180px;line-height:1.55;resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.thumb{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.qlog{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;line-height:1.55;font-size:.95em}
.qa.me{background:var(--accent-soft);border-color:transparent;margin-left:32px}
.qa .src2{display:block;color:var(--muted);font-size:.78em;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;font:500 .85em var(--body);cursor:pointer;text-align:left}
.orig{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.7;font-size:.9em;max-height:340px;overflow:auto}
mark{background:var(--check-soft);color:var(--ink);border-bottom:2px solid var(--check);padding:0 2px;border-radius:3px}
mark sup{font-size:.7em;font-weight:700;color:var(--check);margin-left:2px}
.xlist{display:flex;flex-direction:column;gap:8px}
.xitem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.xitem input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.xitem .n{font-weight:600}
.xitem .qt{grid-column:2;color:var(--muted);font-size:.82em}
.xitem .qt.miss{color:var(--check);font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px;font:600 .9em var(--body);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9em}
.bar .t{height:10px;border-radius:5px;background:var(--line);grid-column:1/3;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--check);border-radius:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
.mode{display:inline-block;font-size:.72em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.speak{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85em var(--body);cursor:pointer;align-self:flex-start}
.copybox{white-space:pre-wrap;font-size:.88em;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;user-select:text}
</style>

const CLS=['ko','en','vi','ne'], CLN={ko:'한국어',en:'English',vi:'Tiếng Việt',ne:'नेपाली'}, SPK={ko:'ko-KR',en:'en-US',vi:'vi-VN',ne:'ne-NP'};
const cl=()=>D.cl||(LANG==='en'?'en':'ko');
const CT={
 ko:{docIs:'당신이 받은 문서는',amount:'납부 금액',due:'납부 기한',todo:'지금 할 일',pay:'위택스에서 납부하기',ask:'추가 질문',counsel:'상담 연결',left:'{n}일 남았어요',today:'오늘이 기한이에요',over:'기한이 지났어요',src:'근거: 양주시 공식 지방세 안내 · 팀 작성 시나리오(세정과 검수 전)',ver:'금액·기한은 고지서 원본이 기준이에요',s1:'금액과 기한이 고지서와 같은지 확인해요',s2:'위택스, 또는 고지서의 QR·가상계좌로 내요',s3:'모르는 것은 내 언어로 물어봐요',speak:'읽어주기',won:'{a}원'},
 en:{docIs:'The document you received is',amount:'Amount to pay',due:'Due date',todo:'What to do now',pay:'Pay on Wetax',ask:'Ask a question',counsel:'Talk to someone',left:'{n} days left',today:'Due today',over:'The due date has passed',src:'Based on: Yangju City local tax guidance · team-written scenarios (not yet reviewed by the tax office)',ver:'The original notice is the final reference for amount and date',s1:'Check that the amount and date match your notice',s2:'Pay on Wetax, or with the QR / virtual account on the notice',s3:'Ask in your language if anything is unclear',speak:'Read aloud',won:'₩{a}'},

 ne:{docIs:'तपाईंले पाएको कागज',amount:'तिर्नुपर्ने रकम',due:'तिर्ने अन्तिम मिति',todo:'अहिले गर्नुपर्ने काम',pay:'Wetax मा भुक्तानी',ask:'थप प्रश्न',counsel:'परामर्शसँग जोड्नुहोस्',left:'{n} दिन बाँकी',today:'आज अन्तिम दिन हो',over:'म्याद नाघिसक्यो',src:'आधार: याङजु सहरको स्थानीय कर जानकारी · टोलीले लेखेको परिदृश्य (कर कार्यालयले जाँच गर्न बाँकी)',ver:'रकम र मितिको अन्तिम आधार मूल बिल नै हो',s1:'रकम र मिति बिलसँग मिल्छ कि जाँच गर्नुहोस्',s2:'Wetax, वा बिलको QR / भर्चुअल खाताबाट तिर्नुहोस्',s3:'नबुझेको कुरा आफ्नै भाषामा सोध्नुहोस्',speak:'पढेर सुनाउनुहोस्',won:'₩{a}'}
};
window.CLS=CLS;window.CLN=CLN;window.SPK=SPK;window.CT=CT;window.SAMPLE_REF=()=>SAMPLE;window.D_SETCL=c=>{D.cl=c};window.CARDLANG=()=>D.cl||(LANG==='en'?'en':'ko');
const fmtWon=n=>Number(n||0).toLocaleString('en-US');
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const dleft=s=>{if(!s)return null;const [y,m,dd]=s.split('-').map(Number);return Math.round((new Date(y,m-1,dd)-today())/864e5)};
const leftText=(c,n)=>n==null?'':n<0?CT[c].over:n===0?CT[c].today:CT[c].left.replace('{n}',n);
const dot=s=>s?s.replace(/-/g,'.'):'-';

async function copyText(btn,el,okMsg){const txt=el.textContent;try{await navigator.clipboard.writeText(txt);btn.textContent=okMsg}catch(e){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent=T('선택했어요. 길게 눌러 복사하세요','Selected. Press and hold to copy')}}

const sampleErr=e=>{if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))SAMPLE=null};
const aiMode=()=>SAMPLE?'':`<span class="mode">${T('시연 모드: AI 연결 없음','Demo mode: AI not connected')}</span>`;

/* ---------- start capabilities ---------- */
(async()=>{
  if(!HAS){loadLocal();return}
  try{SAMPLE=await claude.use('sample')}catch(e){SAMPLE=null}

function loadLocal(){try{NEWB=JSON.parse(localStorage.getItem('hy-newb')||'[]')}catch(e){NEWB=[]}inject()}

  g.fillStyle='#555';g.font=F(18);g.fillText('경기도 양주시 부흥로 1533 (시연용 가상 고지서)',48,108);

  g.fillStyle='#333';g.font=F(18);g.fillText('Automobile Tax Payment Notice (Dec. 2026)  /  汽车税纳税通知书',48,212);
  const row=(y,k,v,hi)=>{g.fillStyle=hi?'#fdeef5':'#f5f6f8';g.fillRect(48,y,804,62);g.fillStyle='#444';g.font=F(20,600);g.fillText(k,68,y+39);g.fillStyle='#111';g.font=F(24,hi?700:400);g.fillText(v,300,y+40)};
  row(260,'납세자 / Taxpayer','김영희 (KIM YEONGHUI)');
  row(332,'주소 / Address','경기도 양주시 남면 상수로 123, 101호');
  row(404,'납세번호 / Tax No.','41630-2026-12-0004321');
  row(476,'과세대상 / Vehicle','12가 3456 (승용 1,598cc)');
  row(560,'납부금액 / Amount','87,500 원',true);
  row(632,'납부기한 / Due date','2026. 12. 31.',true);
  g.fillStyle='#1d4f91';g.font=F(22,700);g.fillText('납부 방법 / How to pay',48,760);
  g.fillStyle='#222';g.font=F(19);
  ['• 위택스(www.wetax.go.kr) — 카드·계좌이체','• 가상계좌 이체 (고지서 뒷면 은행별 계좌)','• 은행 ATM·창구, 간편결제 앱 QR','• 외국어 통역 상담 1345  /  담당부서 031-8082-0000 (가상)'].forEach((t,i)=>g.fillText(t,60,800+i*38));
  g.strokeStyle='#bbb';g.strokeRect(640,930,212,212);g.font=F(16);g.fillStyle='#666';g.fillText('QR 납부 (가상)',680,1160);
  for(let i=0;i<10;i++)for(let j=0;j<10;j++)if((i*7+j*3)%4<2){g.fillStyle='#333';g.fillRect(660+i*17,950+j*17,15,15)}
  g.fillStyle='#999';g.font=F(15);g.fillText('※ 이 고지서는 공모전 시연을 위해 만든 가상 문서입니다.',48,1150);
  return {canvas:c,rects:[[296,266,540,50],[296,338,540,50],[296,410,540,50],[296,482,540,50]]};
}

function fillA(q,c){const d=D.data||{},n=dleft(d.due_date);const ix=c==='ko'?0:1;const tax=(d.tax_name&&(c==='ko'?d.tax_name.ko:(d.tax_name.en||d.tax_name.ko)))||T('이 세금','This tax');

function koNote(question){const d=D.data||{};const tax=(d.tax_name&&d.tax_name.ko)||'지방세';
 return `제목: ${tax} 고지서 관련 문의\n\n안녕하세요. 양주시에 사는 외국인 주민입니다.\n${tax} 고지서(납부기한 ${dot(d.due_date)}, 금액 ${fmtWon(d.amount_won)}원)와 관련해 문의드립니다.\n\n문의 내용: ${question||'(고지서 내용 확인 요청)'}\n\n한국어가 서툴러 통역(1345)과 함께 연락드릴 수 있습니다. 감사합니다.`}
async function trans(text,c){if(c==='ko'||c==='en'||!SAMPLE)return text;try{const r=await SAMPLE(`Translate the following text into ${({vi:'Vietnamese',ne:'Nepali',zh:'Chinese (Simplified)'})[c]||'English'}. Keep numbers, dates, URLs and the phone number 1345 unchanged. Do not add anything. Output only the translation.\n\n${text}`,{modelTier:'quick',cache:{gcTime:864e5}});return r.text.trim()}catch(e){sampleErr(e);return text}}
async function toKorean(text){if(/[가-힣]/.test(text)||!SAMPLE)return text;try{const r=await SAMPLE(`Translate into natural, polite Korean for a city tax officer. Output only the translation.\n\n${text}`,{modelTier:'quick'});return r.text.trim()}catch(e){sampleErr(e);return text}}
async function classify(text){
 const kw=QS.find(q=>q.k.test(text));
 if(!SAMPLE)return kw?kw.id:'none';
 try{const r=await SAMPLE.json(`A resident of Yangju, Korea asks a question about the local tax notice they received. Pick the ONE scenario id that matches the question, or "none" if nothing matches. Scenarios:\n${QS.map(q=>`${q.id}: ${q.q[1]}`).join('\n')}\nQuestions about installments, reductions or exemptions, a wrong amount, already paid, moving or selling a car, or leaving Korea must use those ids. Reply with only JSON like {"id":"card"}.\n\nQuestion: """${text.slice(0,600)}"""`,{modelTier:'quick'});return QS.some(q=>q.id===r.id)?r.id:(kw?kw.id:'none')}catch(e){sampleErr(e);return kw?kw.id:'none'}}

 try{const r=await SAMPLE.json(`You turn a Korean city welfare notice into a structured rule for a citizen-facing eligibility pre-check. Use ONLY what the notice says. For every item, "quote" must be copied EXACTLY, character for character, from the notice (a short phrase, not paraphrased). Write labels and questions in Korean. Each question is a yes/no question to the citizen. Pick stage from: job(구직), work(취업), indep(독립·주거), marry(결혼), birth(임신·출산), care(육아).\nReply with only JSON:\n{"name":"","stage":"indep","summary":"short Korean","who":"short Korean","when":"short Korean","conditions":[{"label":"","question":"","quote":""}],"amount":{"text":"","quote":""},"period":{"text":"","quote":""},"channel":{"type":"online|visit","where":"","quote":""},"documents":[{"name":"","quote":""}]}\n\nNotice:\n"""${s.text.slice(0,12000)}"""`);

 <p class="note">${T('예시 데이터입니다. 시범 운영에서 실제 값으로 바뀝니다.','Example data. Real values come from the pilot.')}</p>`}

function mountMask(){const w=$('cw');if(!w||!D.canvas)return;const v=document.createElement('canvas');v.width=D.canvas.width;v.height=D.canvas.height;v.setAttribute('aria-label',T('문서 사진. 드래그해서 가리기','Document photo. Drag to cover'));w.appendChild(v);
 const g=v.getContext('2d');let cur=null;const draw=()=>{g.drawImage(D.canvas,0,0);g.fillStyle='#000';D.rects.concat(cur?[cur]:[]).forEach(r=>g.fillRect(r[0],r[1],r[2],r[3]))};draw();
 const pt=e=>{const b=v.getBoundingClientRect();return[(e.clientX-b.left)*v.width/b.width,(e.clientY-b.top)*v.height/b.height]};
 let st=null;v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);st=pt(e)});
 v.addEventListener('pointermove',e=>{if(!st)return;const p=pt(e);cur=[Math.min(st[0],p[0]),Math.min(st[1],p[1]),Math.abs(p[0]-st[0]),Math.abs(p[1]-st[1])];draw()});
 v.addEventListener('pointerup',()=>{if(cur&&cur[2]>8&&cur[3]>8)D.rects.push(cur);cur=null;st=null;draw()})}
function maskedBlob(){return new Promise(res=>{const c=document.createElement('canvas');c.width=D.canvas.width;c.height=D.canvas.height;const g=c.getContext('2d');g.drawImage(D.canvas,0,0);g.fillStyle='#000';D.rects.forEach(r=>g.fillRect(r[0],r[1],r[2],r[3]));D.masked=c;c.toBlob(b=>res(b),'image/jpeg',.9)})}

 const blob=await maskedBlob();
 if(!SAMPLE||!IMGOK){if(D.isSample){D.data={doc_type:'tax_notice',tax_name:{ko:'자동차세 (12월 정기분)',en:'Automobile tax (December)',vi:'Thuế ô tô (kỳ tháng 12)',ne:'सवारी कर (डिसेम्बर)',zh:'汽车税（12月定期）'},amount_won:87500,due_date:'2026-12-31',phone_on_doc:'031-8082-0000 (가상)',amount_quote:'87,500 원',due_quote:'2026. 12. 31.',confidence:'high'};D.canvas=D.masked;nav.pop();go({k:'confirm'})}else{toast(T('사진 읽기를 쓸 수 없어요. 직접 입력해 주세요.','Photo reading is unavailable. Please enter it.'));nav.pop();go({k:'manual'})}return}
 try{const r=await SAMPLE.json(`This image is a photo of a document sent by a Korean local government (likely a local tax notice or a city letter). Some personal details are covered with black boxes; never guess them. Never output any personal data (names, addresses, registration numbers, tax numbers, vehicle plates, account numbers). Read only what is printed.\nReply with only JSON:\n{"doc_type":"tax_notice|welfare_notice|other","tax_name":{"ko":"","en":"","zh":"","vi":"","ne":""},"amount_won":number or null,"due_date":"YYYY-MM-DD" or null,"phone_on_doc":"office phone number printed on the notice, or null","amount_quote":"the amount exactly as printed","due_quote":"the due date exactly as printed","confidence":"high|low"}`,{images:blob});
  D.data=r;D.canvas=D.masked;nav.pop();
  if(r.doc_type!=='tax_notice'){toast(r.doc_type==='welfare_notice'?T('복지 안내문이에요. 복지 혜택으로 이동해요.','This is a welfare letter. Opening Welfare.'):T('아직 세금 고지서만 읽을 수 있어요.','Only tax notices can be read for now.'));go(r.doc_type==='welfare_notice'?{k:'welfare'}:{k:'manual'});return}
  go({k:'confirm'})}catch(e){sampleErr(e);nav.pop();toast(T('읽지 못했어요. 직접 입력해 주세요.','Could not read it. Please enter it.'));go({k:'manual'})}}

  t.remove();
  if(r.tax_notice){const d=say(T('받은 고지서는 사진으로 찍으면 내 언어로 할 일을 알려드려요.','Take a photo of the notice and I will explain what to do in your language.'));const b=document.createElement('button');b.className='go';b.textContent=T('받은 문서 찍기 →','Scan a document →');b.onclick=()=>{sheet.hidden=true;nav=[{k:'home'}];ACT.doc()};d.appendChild(b);return}
  const ids=(r.stages||[]).filter(x=>stageById(x));if(!ids.length){say(T('조금만 더 알려 주세요. 지금 상황(취업, 이사, 결혼, 출산, 세금 고지서 등)을 말해 주세요.','Tell me a little more, like your situation (job, moving, marriage, baby, a tax notice).'));return}
  const chips=(r.facts||[]).slice(0,4).map(f=>`<span class="tag">${esc(T(f.ko,f.en))}</span>`).join(' ');const lab=L(stageById(ids[0]).label);
  const d=say(T(`이렇게 이해했어요 ${chips}<br>가장 먼저 볼 단계는 <b>${esc(lab)}</b>이에요.`,`Here is what I understood: ${chips}<br>Start with the <b>${esc(lab)}</b> stage.`));

 }catch(e){t.remove();sampleErr(e);chat.lastChild&&chat.lastChild.remove();inp.value=q;oldAsk()}
};
render();

.showcard{background:var(--ink);color:var(--bg);border-radius:22px;padding:22px 20px;margin-top:14px}
.showcard .k{font-size:.8em;opacity:.75;margin:0 0 6px}
.showcard .ko{font-family:var(--display);font-size:1.55em;line-height:1.35;word-break:keep-all}
.showcard .my{font-size:.95em;opacity:.85;margin-top:12px;line-height:1.5;border-top:1px solid rgb(255 255 255/.15);padding-top:12px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.twin{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.pane h3{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:1.2em}
.pane.ko{border-color:var(--accent)}
.phone{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.phone b{font-family:var(--display);font-size:1.5em;letter-spacing:.02em}
.trnote{font-size:.78em;color:var(--muted);margin-top:10px}
[data-tr]{transition:opacity .2s}

 counter(s){
  const t=s.task?TASKS.find(x=>x.id===s.task):null,c=s.cl||'vi';
  let h=crumb(T('담당자 창구 모드','Officer counter mode'))+`<h1>${T('창구 모드','Counter mode')}</h1><p class="hint">${T('주민의 언어를 고르고 업무를 누르면, 주민에게 보여줄 화면(모국어)과 담당자용 화면(한국어)이 나란히 나와요.','Pick the resident\'s language and the task. The resident sees their language, you see Korean, side by side.')}</p>
  <div class="langrow">${CLS.filter(x=>x!=='ko').map(x=>`<button data-a="ccl" data-v="${x}" aria-pressed="${c===x}">${CLN[x]}</button>`).join('')}</div>
  <div class="chips" style="margin-bottom:14px">${TASKS.map(x=>`<button data-a="ctask" data-v="${x.id}" ${t&&t.id===x.id?'style="border-color:var(--accent);background:var(--accent-soft)"':''}>${esc(x.name[0])}</button>`).join('')}</div>`;
  if(!t)return h;
  const my=(ko,en)=>`<span data-tr="${esc(en)}" data-force="${c}">${esc(en)}</span>`;
  h+=`<div class="twin"><div class="pane" lang="${c}"><h3>${CLN[c]}</h3><p><b>${my(t.name[0],t.name[1])}</b></p><p>${my('어디서','Where')}: ${my(t.where[0],t.where[1])}</p><p>${my('언제까지','When')}: ${my(t.when[0],t.when[1])}</p><p>${my('가져갈 것','Bring')}:</p><ul>${t.docs.map(d=>`<li>${my(d[0],d[1])}</li>`).join('')}</ul></div>
  <div class="pane ko" lang="ko"><h3>한국어 (담당자)</h3><p><b>${esc(t.name[0])}</b></p><p>어디서: ${esc(t.where[0])}</p><p>언제까지: ${esc(t.when[0])}</p><p>가져갈 것:</p><ul>${t.docs.map(d=>`<li>${esc(d[0])}</li>`).join('')}</ul>${t.src?`<p class="note">${esc(t.src)}</p>`:''}</div></div>
  <p class="trnote">${T('모국어 문구는 AI 번역 초안입니다. 시 공식 다국어 안내문이 확보되면 그 문장으로 교체합니다.','Native-language text is an AI draft; replaced by the city\'s official translations when available.')}</p>`;
  return h;
 }
});
/* officer screen: add counter tab */
const _admin=EXT.admin;
EXT.admin=function(s){let h=_admin(s);return h.replace('<div class="tabs" role="tablist">','<div class="tabs" role="tablist"><button role="tab" aria-selected="false" data-a="gocounter">'+T('창구 모드','Counter')+'</button>')};

/* ---- actions ---- */
Object.assign(window.ACT,{
 setlang:t=>{const c=t.dataset.v;try{localStorage.setItem('hy-cl',c)}catch(e){}window.D_SETCL(c);LANG=c==='ko'?'ko':'en';try{localStorage.setItem('hy-lang',LANG)}catch(e){}chrome();nav=[{k:'home'}];render()},
 golang:()=>go({k:'lang'}),
 task:t=>go({k:'task',v:t.dataset.v}),
 lifeitem:t=>go({k:'lifeitem',v:t.dataset.v}),
 askAbout2:t=>{const task=TASKS.find(x=>x.id===t.dataset.v);openGuide();say(T(`<b>${esc(task.name[0])}</b>에 대해 더 궁금한 것을 적어 주세요. 담당자에게 보여줄 한국어 메모로 바꿔 드릴게요.`,`Ask anything about <b>${esc(task.name[1])}</b>. I will turn it into a Korean note for the officer.`))},
 gocounter:()=>go({k:'counter',cl:'vi'}),
 ccl:(t,s)=>{s.cl=t.dataset.v;render()},
 ctask:(t,s)=>{s.task=t.dataset.v;render()}
});
/* translate after each render */
const _r=render;render=function(){_r();const k=nav.at(-1).k;const forced=view.querySelector('[data-force]');if(forced){const c=forced.dataset.force;[...view.querySelectorAll('[data-force]')].forEach(async n=>{if(n.dataset.done===c)return;n.style.opacity=.55;const t=await tr(n.getAttribute('data-tr'),c);if(n.isConnected){n.textContent=t;n.dataset.done=c;n.style.opacity=1}})}else trView()};
/* first visit → language screen */
let picked=null;try{picked=localStorage.getItem('hy-cl')}catch(e){}
if(picked&&CLS.includes(picked)){window.D_SETCL(picked);LANG=picked==='ko'?'ko':'en';chrome();nav=[{k:'home'}]}else nav=[{k:'lang'}];
render();
})();
</script>
