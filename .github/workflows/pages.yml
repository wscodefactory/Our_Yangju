# GitHub Pages 배포. main 또는 feature/* 에 푸시하면 dist/ 를 빌드해 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔 둬야 동작한다.
# Claude 키는 기본적으로 넣지 않는다(공개 번들에 키가 노출되므로). 시연 기기에서 "AI 키 넣기" 버튼으로 넣는 게 기본.
# 꼭 번들에 넣어야 하면 Settings → Secrets → VITE_CLAUDE_API_KEY 를 등록하면 아래 env 로 들어간다.
name: pages
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
  # 매일 06:00 KST 에 행사 목록을 다시 긁어 배포
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # 번역 키(secret)가 들어 있는지만 본다. 없으면 이 작업만 실패하고 배포는 그대로 간다 (행사가 한국어로만 올라감)
  secrets-check:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.VITE_CLAUDE_API_KEY }}
    steps:
      - run: |
          if [ -n "$KEY" ]; then echo "번역 키 있음 (길이 ${#KEY})"; else echo "::error::VITE_CLAUDE_API_KEY secret 없음"; exit 1; fi
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 양주시 행사 게시판 수집 + 번역. 실패해도 기존 events.json 으로 빌드
      - run: node scripts/fetch-events.mjs
        env:
          VITE_CLAUDE_API_KEY: ${{ secrets.VITE_CLAUDE_API_KEY }}
      - run: npx tsc -b && npx vite build --mode pages
        env:
          VITE_CLAUDE_API_KEY: ${{ secrets.VITE_CLAUDE_API_KEY }}
          VITE_CLAUDE_MODEL: claude-haiku-5-5
          # 배포본은 중계 서버로 부른다 (키는 Worker 비밀값에만)
          VITE_AI_PROXY: https://our-yangju.mikael8047.workers.dev
      # enablement: 저장소에 Pages 가 안 켜져 있으면 워크플로가 직접 켠다 (Settings → Pages 수동 설정 불필요)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
