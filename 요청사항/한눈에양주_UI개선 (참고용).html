<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한눈에 양주">
<meta name="format-detection" content="telephone=no">
<title>한눈에 양주 | 양주시</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
   Yangju DS (양주시 CI 기반 디자인 토큰)
   - Brand:  Yangju Green #51A121 / Orange #FF6600 / Yellow #FE9E32 / Cool Gray #666465
   - City color: 별산담황색 #C98D36
   - 텍스트와 버튼 색은 WCAG 2.2 AA(4.5:1) 이상이 되도록 브랜드 색을 명도 조정해 사용
   ========================================================= */
:root{
  --yj-green:#51A121; --yj-orange:#FF6600; --yj-yellow:#FE9E32; --yj-gray:#666465; --yj-amber:#C98D36;

  --primary:#3B7D17;        /* on white 5.08:1 */
  --primary-hover:#2E6312;  /* on white 7.22:1 */
  --on-primary:#FFFFFF;
  --primary-tint:#EEF6E8;
  --primary-tint-2:#DCEBCF;

  --accent-text:#B84A00;    /* orange text 5.23:1 */
  --accent-tint:#FFF0E5;
  --warn-tint:#FFF6E8; --warn-line:#FE9E32; --warn-text:#6E4300;
  --heritage-tint:#F8EFE0; --heritage-text:#8A5E1E;
  --info-tint:#EAF1FA; --info-text:#1D4F91;
  --danger:#C62828; --danger-tint:#FDECEC;

  --bg:#F4F6F1; --surface:#FFFFFF; --surface-2:#F7F8F5;
  --border:#E1E5DC; --border-strong:#C5CCBE;
  --text:#1B1F19; --text-2:#55595F;
  --overlay:rgba(16,22,13,.48);
  --shadow:0 1px 2px rgba(20,30,15,.05),0 6px 18px rgba(20,30,15,.06);
  --shadow-lg:0 12px 40px rgba(20,30,15,.18);
  --radius:16px; --radius-sm:12px; --radius-xs:8px;
  --focus:0 0 0 3px var(--surface),0 0 0 5px var(--yj-green);
  --app-w:480px; /* 모바일 웹앱 한 열 폭 */
  --desk-bg:#DCE3D5;
  color-scheme:light;
}
/* ---------- Base ---------- */
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
html.big{font-size:118.75%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:1rem;line-height:1.6;letter-spacing:-.005em;
  word-break:keep-all;overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}
:lang(zh){font-family:"Pretendard Variable",Pretendard,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
:lang(ne){font-family:"Noto Sans Devanagari","Pretendard Variable",Pretendard,system-ui,sans-serif;line-height:1.75}
[lang="ko"]{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
img{max-width:100%;display:block}
/* 모바일 웹앱: 탭 반응, 더블탭 확대 방지, 스크롤 튐 방지 */
button,a,label,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{overscroll-behavior-y:none}
/* 태블릿과 PC에서는 앱 폭 한 열을 가운데 두고 바깥은 배경으로 */
@media (min-width:520px){
  html{background:var(--desk-bg)}
  body{max-width:var(--app-w);margin:0 auto;min-height:100vh;min-height:100dvh;box-shadow:0 0 0 1px var(--border),0 0 40px rgba(20,30,15,.12)}
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-xs)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
.ic.lg{width:28px;height:28px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- App bar (global header) ---------- */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:var(--app-w);margin:0 auto;height:64px;padding:0 8px 0 16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0;flex:1;padding:4px 0;border-radius:var(--radius-xs)}
.logo-plate{display:grid;place-items:center;height:44px;flex:none}
.logo-plate img{height:40px;width:auto}
.brand-div{width:1px;height:28px;background:var(--border-strong);flex:none}
.brand-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.brand-txt strong{font-size:1.0625rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{font-size:.75rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:2px;flex:none}
.icon-btn{
  position:relative;width:44px;height:44px;display:grid;place-items:center;
  border:0;border-radius:12px;background:transparent;color:var(--text);
  transition:background .15s;
}
@media (hover:hover){.icon-btn:hover{background:var(--surface-2)}}
.icon-btn:active{background:var(--surface-2)}
.icon-btn[aria-pressed="true"],.icon-btn[aria-current="page"]{background:var(--primary-tint);color:var(--primary)}
.icon-btn .badge{
  position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--yj-orange);color:#fff;font-size:.6875rem;font-weight:700;line-height:18px;text-align:center;
  box-shadow:0 0 0 2px var(--surface);
}
.tip{position:relative}
@media (hover:hover){.tip[data-tip]:hover::after,.tip[data-tip]:focus-visible::after{
  content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;
  background:var(--text);color:var(--surface);font-size:.75rem;padding:4px 8px;border-radius:6px;z-index:30;pointer-events:none;
}}

/* ---------- Layout ---------- */
main{max-width:var(--app-w);margin:0 auto;padding:0 16px 32px}
.pagehead{display:flex;align-items:center;gap:4px;margin:12px -8px 4px}
.pagehead h1{font-size:1.375rem;line-height:1.35;margin:0;font-weight:700;flex:1;min-width:0}
.pagehead .icon-btn{flex:none}
.lead{color:var(--text-2);margin:4px 0 20px;font-size:.9375rem}
.sec-title{font-size:1.0625rem;font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title .count{font-size:.8125rem;color:var(--text-2);font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- Hero ---------- */
.hero{
  margin:16px 0 4px;padding:24px 20px;border-radius:20px;position:relative;overflow:hidden;
  background:var(--primary-tint);border:1px solid var(--primary-tint-2);
}
.hero::before{ /* CI의 잎사귀 모티프 (녹색, 주황) */
  content:"";position:absolute;right:-26px;top:-30px;width:120px;height:120px;border-radius:0 100% 0 100%;
  background:var(--yj-green);opacity:.12;transform:rotate(-12deg);
}
.hero::after{
  content:"";position:absolute;right:46px;top:-18px;width:56px;height:56px;border-radius:0 100% 0 100%;
  background:var(--yj-orange);opacity:.16;transform:rotate(18deg);
}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:600;color:var(--primary);margin:0 0 8px}
.hero h1{font-size:1.75rem;line-height:1.3;margin:0 0 10px;font-weight:800;letter-spacing:-.02em;position:relative}
.hero p.desc{margin:0;color:var(--text-2);font-size:.9375rem;position:relative;max-width:34em}

/* ---------- Cards ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:18px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);color:var(--text);text-decoration:none;transition:border-color .15s,transform .15s;
}
@media (hover:hover){.card:hover{border-color:var(--primary)}}
.card:active{transform:scale(.99)}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card .t{font-weight:700;font-size:1.0625rem;line-height:1.35}
.card .d{font-size:.875rem;color:var(--text-2);line-height:1.45}
.card .chev{color:var(--text-2)}
.ibox{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.tone-green{background:var(--primary-tint);color:var(--primary)}
.tone-orange{background:var(--accent-tint);color:var(--accent-text)}
.tone-amber{background:var(--heritage-tint);color:var(--heritage-text)}
.tone-blue{background:var(--info-tint);color:var(--info-text)}
.tone-red{background:var(--danger-tint);color:var(--danger)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:14px 6px;
  border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-size:.875rem;font-weight:600;text-align:center;line-height:1.3;position:relative;
}
@media (hover:hover){.tile:hover{border-color:var(--primary)}}
.tile:active,.row:active,.bcard-main:active{background:var(--surface-2)}
.tile .live{position:absolute;top:-9px;left:50%;transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface)}

/* list group */
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{
  display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;min-height:64px;
  background:transparent;border:0;border-bottom:1px solid var(--border);text-align:left;color:var(--text);text-decoration:none;
}
.row:last-child{border-bottom:0}
@media (hover:hover){.row:hover{background:var(--surface-2)}}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:600;line-height:1.4}
.row .d{font-size:.8125rem;color:var(--text-2);line-height:1.4}
.row .ibox{width:40px;height:40px;border-radius:12px}
.row .num{font-weight:800;font-size:1.25rem;min-width:88px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row .act{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--primary-tint);color:var(--primary);font-weight:600;font-size:.875rem;flex:none}

/* panel */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow)}
.panel h2{font-size:1.0625rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h2 .grow{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;margin:0}
.kv dt{display:flex;align-items:flex-start;gap:8px;color:var(--text-2);font-size:.875rem;font-weight:600;padding-top:1px;white-space:nowrap}
.kv dd{margin:0;font-weight:500}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.bdg.green{background:var(--primary-tint);color:var(--primary)}
.bdg.orange{background:var(--accent-tint);color:var(--accent-text)}
.bdg.amber{background:var(--heritage-tint);color:var(--heritage-text)}
.bdg.blue{background:var(--info-tint);color:var(--info-text)}
.bdg.gray{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.bdg.red{background:var(--danger-tint);color:var(--danger)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;width:100%;
  border-radius:var(--radius-sm);border:1px solid transparent;font-weight:700;font-size:1rem;text-decoration:none;
  transition:background .15s,border-color .15s;
}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn.secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--primary);min-height:44px;padding:0 12px;width:auto}
.btn.sm{min-height:40px;font-size:.875rem;padding:0 14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* segmented & chips */
.seg{display:flex;padding:4px;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:.9375rem;color:var(--text-2);padding:0 8px;line-height:1.25}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border-strong);font-weight:600;font-size:.875rem;color:var(--text);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip .soon{font-size:.6875rem;font-weight:600;opacity:.75}
.field-label{font-size:.8125rem;font-weight:700;color:var(--text-2);margin:16px 0 8px;display:block}

/* callouts */
.callout{display:flex;gap:10px;padding:14px;border-radius:var(--radius-sm);font-size:.875rem;line-height:1.55}
.callout .ic{margin-top:1px}
.callout.info{background:var(--info-tint);color:var(--info-text)}
.callout.warn{background:var(--warn-tint);color:var(--warn-text);border-left:4px solid var(--warn-line)}
.callout.green{background:var(--primary-tint);color:var(--text)}
.callout b{font-weight:700}

/* checklist */
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border-strong);display:grid;place-items:center;flex:none;margin:0;background:var(--surface)}
.check input:checked{background:var(--primary);border-color:var(--primary)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-primary);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{color:var(--text-2);text-decoration:line-through}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:4px 0 6px;border:1px solid var(--border)}
.progress i{display:block;height:100%;background:var(--yj-green);transition:width .25s}
.prog-txt{font-size:.8125rem;color:var(--text-2);font-weight:600}

/* say-to-staff */
.say{border:2px solid var(--yj-green);background:var(--surface);border-radius:var(--radius);padding:18px 16px}
.say .ko{font-size:1.25rem;font-weight:700;line-height:1.55;margin:6px 0 10px}
.say .mean{font-size:.875rem;color:var(--text-2);margin:0 0 14px;padding-top:10px;border-top:1px solid var(--border)}
.say .mean b{color:var(--text)}

/* stepper */
.stepper{display:flex;gap:6px;margin:4px 0 20px;list-style:none;padding:0}
.stepper li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:.75rem;color:var(--text-2);font-weight:600;line-height:1.3}
.stepper li::before{content:"";height:4px;border-radius:2px;background:var(--border)}
.stepper li.done::before,.stepper li.cur::before{background:var(--yj-green)}
.stepper li.cur{color:var(--primary)}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:.875rem;font-weight:700;margin-bottom:6px}
.fld label .opt{font-weight:500;color:var(--text-2);font-size:.8125rem}
.fld input,.fld select{width:100%;min-height:52px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);font-size:1rem}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint-2)}
.fld .help{font-size:.8125rem;color:var(--text-2);margin-top:4px}
.fld.err input{border-color:var(--danger)}
.err-msg{color:var(--danger);font-size:.8125rem;margin-top:4px;font-weight:600}

/* notice preview (원본 고지서 모사, 한국어 유지) */
.notice{background:#fff;color:#222;border-radius:12px;border:1px solid #D9DDD4;overflow:hidden;font-size:.8125rem}
.notice .nh{background:#F3F7EF;padding:12px 14px;border-bottom:3px solid #51A121}
.notice .nh b{display:block;font-size:.9375rem;color:#1D3D0B}
.notice .nr{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:8px 14px;border-bottom:1px solid #EEF0EA;align-items:center}
.notice .nr span:first-child{color:#666}
.notice .nr.hl{background:#FFF8EF}
.notice .mask{display:inline-block;height:14px;border-radius:3px;background:#1B1F19;width:70%}
.notice .cap{display:flex;align-items:center;gap:6px;padding:8px 14px;color:#555;font-size:.75rem;background:#FAFAF8}

/* result summary */
.sum{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.sum-top{padding:18px 16px 14px;background:var(--primary-tint);display:flex;align-items:flex-start;gap:10px}
.sum-top .tx{flex:1}
.sum-top .lab{font-size:.8125rem;color:var(--text-2);font-weight:600}
.sum-top .name{font-size:1.25rem;font-weight:800;line-height:1.35}
.sum-grid{display:grid;grid-template-columns:1fr 1fr}
.sum-grid > div{padding:16px;border-right:1px solid var(--border)}
.sum-grid > div:last-child{border-right:0}
.sum-grid .lab{font-size:.8125rem;color:var(--text-2);font-weight:600}
.sum-grid .val{font-size:1.375rem;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.sum-grid .orig{font-size:.75rem;color:var(--text-2)}
@media (max-width:380px){.sum-grid{grid-template-columns:1fr}.sum-grid > div{border-right:0;border-bottom:1px solid var(--border)}}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:.875rem;flex:none}

.pay{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.pay:last-child{border-bottom:0;padding-bottom:0}
.pay:first-of-type{padding-top:0}
.pay .rank{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);font-weight:800;font-size:.8125rem;flex:none}
.pay .tx{flex:1;min-width:0}
.pay .t{font-weight:700}
.pay .d{font-size:.875rem;color:var(--text-2)}
.codebox{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.codebox code{flex:1;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9375rem;font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.recommended{margin-left:6px}

details.faq{border-bottom:1px solid var(--border)}
details.faq:last-child{border-bottom:0}
details.faq summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 0;font-weight:600;cursor:pointer;min-height:52px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .ic{transition:transform .2s;color:var(--text-2)}
details.faq[open] summary .ic{transform:rotate(90deg)}
details.faq summary .q{flex:1}
details.faq p{margin:0 0 14px 0;color:var(--text-2);font-size:.9375rem}

/* benefit card */
.bcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
@media (hover:hover){.bcard:hover{border-color:var(--primary)}}
.bcard-main{display:block;width:100%;text-align:left;background:transparent;border:0;padding:16px 60px 16px 16px;border-radius:var(--radius);color:var(--text)}
.bcard-main .t{font-weight:700;font-size:1.0625rem;margin:8px 0 2px;line-height:1.4}
.bcard-main .d{font-size:.875rem;color:var(--text-2)}
.bcard .bm{position:absolute;top:8px;right:8px}
.icon-btn.bm[aria-pressed="true"]{background:transparent;color:var(--yj-orange)}
.icon-btn.bm[aria-pressed="true"] .ic{fill:currentColor}

/* quiz */
.quiz-q{padding:14px 0;border-bottom:1px solid var(--border)}
.quiz-q:last-of-type{border-bottom:0}
.quiz-q p{margin:0 0 10px;font-weight:600}
.quiz-q .seg button{min-height:40px;font-size:.875rem}
.quiz-q .seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.result{margin-top:12px}

/* events */
.ev{display:flex;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.ev .date{width:56px;flex:none;text-align:center;border-radius:12px;background:var(--heritage-tint);color:var(--heritage-text);padding:8px 4px;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.ev .date b{font-size:1.375rem}
.ev .date small{font-size:.6875rem;font-weight:700;text-transform:uppercase}
.ev .tx{flex:1;min-width:0}
.ev .t{font-weight:700;font-size:1.0625rem;margin:6px 0 4px}
.ev .meta{display:flex;flex-direction:column;gap:2px;font-size:.8125rem;color:var(--text-2)}
.ev .meta span{display:flex;gap:6px;align-items:center}
.ev .btn{margin-top:10px}
.ev.done{opacity:.72}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat .lab{font-size:.8125rem;color:var(--text-2);font-weight:600}
.stat .val{font-size:1.25rem;font-weight:800;line-height:1.3;margin-top:2px}
.swatch{display:flex;align-items:center;gap:12px}
.swatch i{width:44px;height:44px;border-radius:12px;background:var(--yj-amber);flex:none}

/* footer */
.foot{max-width:var(--app-w);margin:0 auto;padding:24px 16px calc(104px + env(safe-area-inset-bottom));color:var(--text-2);font-size:.8125rem;border-top:1px solid var(--border)}
.foot p{margin:0 0 8px}
.foot .links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}
.foot a{color:var(--text-2);display:inline-flex;align-items:center;gap:4px;font-weight:600}
.foot .ci{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.foot .ci img{height:28px}

/* FAB */
.fab{
  position:fixed;z-index:25;right:max(16px,calc((100vw - var(--app-w))/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom));
  display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 16px;border-radius:28px;border:0;
  background:var(--primary);color:var(--on-primary);font-weight:700;font-size:1rem;box-shadow:var(--shadow-lg);
}
.fab:hover{background:var(--primary-hover)}

/* sheets & dialogs */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}

.sheet{

  border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom);
}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 8px 8px 20px;border-bottom:1px solid var(--border)}
.sheet-h h2{flex:1;margin:0;font-size:1.125rem;display:flex;align-items:center;gap:8px}
.sheet-b{padding:16px 20px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet-h::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:var(--border-strong);transform:translateX(-50%)}
.sheet-h{position:relative}
.sheet-f{padding:12px 16px 16px;border-top:1px solid var(--border)}
.opt-list{display:flex;flex-direction:column;gap:8px}

.opt .tx{flex:1;display:flex;flex-direction:column;line-height:1.35}

.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ask{display:flex;gap:8px;align-items:center}

.ask input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint-2)}
.ask .icon-btn{background:var(--primary);color:var(--on-primary);border-radius:50%;width:48px;height:48px}
.hint{font-size:.75rem;color:var(--text-2);margin:8px 4px 0;display:flex;gap:6px;align-items:center}

/* full-screen show */
.show{position:fixed;inset:0;max-width:var(--app-w);margin:0 auto;z-index:50;background:#fff;color:#111;display:flex;flex-direction:column;padding:20px;padding-top:calc(20px + env(safe-area-inset-top))}

const L = () => LANGS.findIndex(l=>l.code===(S.lang||"ko"));
/* 런타임 ICU에 해당 로캘이 없으면 Intl이 브라우저 기본 로캘(예: ko)로 조용히 떨어진다.
   그래서 지원 여부를 확인하고, 없으면 영어 형식으로 폴백해 한국어가 새지 않게 한다. */
const LOC_OK = {};
const LOC = () => {
  const loc = LANGS[L()].locale;
  if (!(loc in LOC_OK)) { try { LOC_OK[loc] = Intl.DateTimeFormat.supportedLocalesOf([loc]).length > 0; } catch(e) { LOC_OK[loc] = false; } }
  return LOC_OK[loc] ? loc : "en-GB";
};
const tx = arr => (arr && (arr[L()] ?? arr[1])) || "";
const t = (k, vars) => {
  let s = UI[k] ? tx(UI[k]) : k;
  if (vars) for (const v in vars) s = s.replace("{"+v+"}", vars[v]);
  return s;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const attr = o => esc(JSON.stringify(o));
const parseDate = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtDate = (s, opt={year:"numeric",month:"long",day:"numeric",weekday:"short"}) => new Intl.DateTimeFormat(LOC(), opt).format(parseDate(s));
const fmtRange = (a,b) => {
  const f = new Intl.DateTimeFormat(LOC(), {year:"numeric",month:S.lang==="zh"?"long":"short",day:"numeric"});
  return a===b ? f.format(parseDate(a)) : (f.formatRange ? f.formatRange(parseDate(a),parseDate(b)).replace(/\s*[\u2013\u2014]\s*/g," - ") : f.format(parseDate(a))+" - "+f.format(parseDate(b)));
};
const fmtWon = n => S.lang==="ko" || !S.lang
  ? new Intl.NumberFormat("ko-KR").format(n)+"원"
  : new Intl.NumberFormat(LOC(), {style:"currency", currency:"KRW", currencyDisplay:"symbol"}).format(n);
const fmtNum = n => new Intl.NumberFormat(LOC()).format(n);
const daysUntil = s => Math.round((parseDate(s) - TODAY)/86400000);
const benefit = id => BEN.find(b=>b.id===id);
const isSaved = id => S.saved.includes(id);

/* 누락 번역 점검 (개발용) */
(function audit(){
  const bad=[];
  const walk=(o,p)=>{ if(Array.isArray(o)){ if(o.length===5&&o.every(x=>typeof x==="string")){ if(o.some(x=>!x.trim())) bad.push(p);} else o.forEach((x,i)=>walk(x,p+"["+i+"]")); } else if(o&&typeof o==="object"){ for(const k in o) walk(o[k],p+"."+k);} };
  walk({UI,VISIT,LIFE,GROUPS,STAGES,LV,ST,BEN,EVENTS,PLACES,CERTS,HERITAGE,AREAS,TAX_TYPES,FAQ},"root");
  for(const k in UI) if(UI[k].length!==5) bad.push("UI."+k);
  if(bad.length) console.warn("Missing translations:",bad);
})();

function go(r){ S.stack.push(r); history.pushState({d:S.stack.length},""); render(true); }
function back(){ if(S.stack.length>1){ history.back(); } else { S.stack=[{k:"home"}]; render(true);} }
function home(){ const n=S.stack.length-1; S.stack=[{k:"home"}]; if(n>0) history.go(-n); render(true); }

let toastTimer;
function toast(msg){
  const el=document.getElementById("toast");
  el.innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.innerHTML="",2600);
}
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=s; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(_){} ta.remove(); }
  toast(t("copied"));
}
function speak(text, code){
  if (!("speechSynthesis" in window)) return toast(t("noVoice"));
  const lg = LANGS.find(l=>l.code===code) || LANGS[0];
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(lg.tts));
  if (!v && voices.length) return toast(t("noVoice"));
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lg.locale.split("-u-")[0]; if (v) u.voice = v; u.rate = .95;
  speechSynthesis.speak(u);
}
function setLang(code){
  const first = !S.lang;
  S.lang = code; store.set("lang", code);
  S.langOpen = false;
  if (first){ S.stack=[{k:"home"}]; render(true); } else { render(false); }
}
function askChat(text){
  const s = text.trim(); if(!s) return;
  S.msgs.push({text:s});
  const hit = INTENTS.find(i=>i.re.test(s));
  S.msgs.push(hit ? {bot:true,key:"chatFound",go:hit.go} : {bot:true,key:"chatMiss"});
  renderLayer();
  const b=document.getElementById("chat-body"); if(b) b.scrollTop=b.scrollHeight;
  const inp=document.getElementById("ask-in"); if(inp) inp.focus();
}
function makeNote(b){
  const qs = b.quiz.map(q=>q[0]).join(" / ");
  return `제목: ${b.name[0]} 신청 자격 문의\n\n안녕하세요. 양주시에 살고 있는 ${S.lang==="ko"?"시민":"외국인 주민"}입니다.\n'${b.who[0]}' 조건과 관련해 제 상황에서 신청할 수 있는지 확인 부탁드립니다.\n\n확인하고 싶은 내용: ${qs}\n\n${S.lang==="ko"?"":"한국어가 서툴러 필요하면 통역(1345)과 함께 연락드리겠습니다. "}감사합니다.`;
}
function goRoute(r){
  if (r.k==="benefit") S.benTab="elig";
  if (r.k==="docResult") S.docTab="pay";
  go(r);
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a.startsWith("scrim-") && e.target!==el) return;
  switch(a){
    case "home": e.preventDefault(); if(cur().k!=="lang") home(); break;
    case "back": back(); break;
    case "go": goRoute(JSON.parse(el.dataset.go)); break;
    case "openlang": S.langOpen=true; renderLayer(); setTimeout(()=>{const x=document.querySelector('.sheet [aria-checked="true"]'); x&&x.focus();},30); break;
    case "closelang": case "scrim-lang": S.langOpen=false; renderLayer(); document.querySelector('[data-act="openlang"]')?.focus(); break;
    case "setlang": setLang(el.dataset.v); break;
    case "big": S.big=!S.big; store.set("big",S.big); render(false); break;
    case "saved": if(cur().k!=="saved") go({k:"saved"}); break;
    case "chat": S.chatOpen=true; renderLayer(); setTimeout(()=>document.getElementById("ask-in")?.focus(),30); break;
    case "closechat": case "scrim-chat": S.chatOpen=false; renderLayer(); document.querySelector(".fab")?.focus(); break;
    case "sheet": S.sheet={kind:el.dataset.kind, id:el.dataset.id}; renderLayer(); document.querySelector('.sheet [data-act="closesheet"]')?.focus(); break;
    case "closesheet": case "scrim-sheet": S.sheet=null; renderLayer(); break;
    case "sug": askChat(t(el.dataset.v)); break;
    case "chatgo": S.chatOpen=false; goRoute(JSON.parse(el.dataset.go)); break;
    case "copy": copyText(el.dataset.text); break;
    case "speak": speak(el.dataset.text, el.dataset.lang); break;
    case "show": S.full=el.dataset.id; renderLayer(); document.querySelector(".show .x")?.focus(); break;
    case "closefull": S.full=null; renderLayer(); document.querySelector('[data-act="show"]')?.focus(); break;
    case "bm": {
      const id=el.dataset.id;
      S.saved = isSaved(id) ? S.saved.filter(x=>x!==id) : [...S.saved, id];
      store.set("saved",S.saved); toast(isSaved(id)?t("savedToast"):t("unsavedToast")); render(false); break; }
    case "grp": S.grp=el.dataset.v; render(false); break;
    case "stage": S.stage=el.dataset.v; render(false); break;
    case "seg": {
      const n=el.dataset.name, v=el.dataset.v;
      if (n==="docTab") S.docTab=v; else if (n==="benTab") S.benTab=v; else if (n==="exTab") S.tab=v;
      render(false); break; }
    case "quiz": { const b=el.dataset.b; S.quiz[b]=S.quiz[b]||{}; S.quiz[b][el.dataset.i]=el.dataset.v; render(false); break; }
    case "docsample": S.doc={...SAMPLE}; S.docErr=false; go({k:"docConfirm"}); break;
    case "docmanual": S.doc={type:"auto"}; S.docErr=false; go({k:"docConfirm",manual:true}); break;
  }
});
document.addEventListener("change", e=>{
  const c = e.target.closest("[data-check]");
  if (!c) return;
  const key=c.dataset.check; S.checks[key]=S.checks[key]||{}; S.checks[key][c.dataset.i]=c.checked;
  const all=document.querySelectorAll(`[data-check="${key}"]`); const n=[...all].filter(x=>x.checked).length;
  document.getElementById("prog-"+key).textContent=t("docsProgress",{a:n,b:all.length});
  document.getElementById("bar-"+key).style.width=Math.round(n/all.length*100)+"%";
});
document.addEventListener("submit", e=>{
  if (e.target.id==="askform"){ e.preventDefault(); const i=document.getElementById("ask-in"); askChat(i.value); return; }
  if (e.target.id==="docform"){
    e.preventDefault();
    const f=new FormData(e.target);
    const amount = Number(String(f.get("amount")||"").replace(/[^0-9]/g,""));
    const due = f.get("due");
    const prev = S.doc||{};
    S.doc = {...prev, type:f.get("type"), amount: amount||0, due, epay:String(f.get("epay")||"").trim(), vacct:String(f.get("vacct")||"").trim()};
    if (prev.sample && (S.doc.amount!==prev.amount || S.doc.due!==prev.due)) { S.doc.amountQ=null; S.doc.dueQ=null; }
    if (!S.doc.amount || !S.doc.due){ S.docErr=true; render(false); document.querySelector('[aria-invalid="true"]')?.focus(); return; }
    S.docErr=false; S.docTab="pay"; go({k:"docResult"});
  }
});
document.addEventListener("keydown", e=>{
  if (e.key!=="Escape") return;
  if (S.full){ S.full=null; renderLayer(); }
  else if (S.sheet){ S.sheet=null; renderLayer(); }
  else if (S.chatOpen){ S.chatOpen=false; renderLayer(); }
  else if (S.langOpen){ S.langOpen=false; renderLayer(); }
});
if ("speechSynthesis" in window) speechSynthesis.getVoices();
history.replaceState({d:1},"");
render(true);

</script>
</body>
</html>
